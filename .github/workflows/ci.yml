# tg-media-bot CI: unit + e2e tests on every push/PR
# The upstream test suite (bot.test.ts, bot.e2e.test.ts) runs a fake Bot API
# in-process and a test/yt-dlp stub, so no real token is needed. ffmpeg must
# be present (the e2e suite generates a fixture mp4 with it).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install yt-dlp (tests only use the stub, but the bot probes it)
        run: |
          curl -fsSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux \
            -o /usr/local/bin/yt-dlp
          chmod +x /usr/local/bin/yt-dlp

      - name: Install deps
        working-directory: bot
        run: bun install --frozen-lockfile

      - name: Run tests
        working-directory: bot
        run: bun test
        timeout-minutes: 15
